<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
  <title>How Wino's push relay delivers mailbox changes to every platform</title>
  <desc>Gmail, Outlook and IMAP servers notify the Wino relay, which delivers changes to phones through push notifications and to desktops through an encrypted socket. Desktop IMAP accounts are watched by the app itself.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#FFFFFF"/>

  <g>
    <rect x="60" y="40" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="140" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Gmail</text>
    <text x="140" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Watch via Pub/Sub</text>
  </g>
  <g>
    <rect x="260" y="40" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Outlook</text>
    <text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Graph webhook</text>
  </g>
  <g>
    <rect x="460" y="40" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="540" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">IMAP server</text>
    <text x="540" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Relay runs IDLE (mobile)</text>
  </g>

  <line x1="140" y1="96" x2="140" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="96" x2="340" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="96" x2="540" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="150" width="560" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">WinoRelay</text>
    <text x="340" y="194" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Watches mailboxes, pushes changes</text>
  </g>

  <line x1="180" y1="214" x2="180" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="214" x2="500" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="260" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="180" y="278" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Push notification</text>
    <text x="180" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">APNs and FCM</text>
  </g>
  <g>
    <rect x="380" y="260" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="500" y="278" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Live socket</text>
    <text x="500" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Encrypted, while app runs</text>
  </g>

  <line x1="180" y1="316" x2="180" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="316" x2="500" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="360" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="180" y="378" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">iPhone, iPad, Android</text>
    <text x="180" y="398" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Wakes and syncs instantly</text>
  </g>
  <g>
    <rect x="380" y="360" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="500" y="378" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Windows and macOS</text>
    <text x="500" y="398" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Falls back to 5 min timer</text>
  </g>

  <path d="M620 68 L638 68 L638 388 L620 388" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="340" y="456" text-anchor="middle" font-size="12" fill="#5F5E5A">Dashed: desktop watches IMAP itself, no credentials leave the device</text>
</svg>
