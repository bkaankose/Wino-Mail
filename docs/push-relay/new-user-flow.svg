<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
  <title>What happens when a new user adds an account</title>
  <desc>The user adds an account and accepts the privacy terms once. The app proves it is genuine with App Attest or Play Integrity, the Wino API issues a device token, and the relay starts watching the mailbox. Signing in to a Wino Account is optional and only links devices for web management.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="260" fill="#FFFFFF"/>

  <g>
    <rect x="50" y="40" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="115" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Add account</text>
    <text x="115" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Accept privacy once</text>
  </g>
  <line x1="180" y1="68" x2="198" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="200" y="40" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="265" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Device attests</text>
    <text x="265" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Apple or Google signs</text>
  </g>
  <line x1="330" y1="68" x2="348" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="350" y="40" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="415" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Wino API</text>
    <text x="415" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Issues device token</text>
  </g>
  <line x1="480" y1="68" x2="498" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="500" y="40" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="565" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Relay watches</text>
    <text x="565" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Up to 10 mailboxes</text>
  </g>

  <path d="M340 160 L340 130 L415 130 L415 98" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <g>
    <rect x="200" y="160" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Wino Account, optional</text>
    <text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Links devices, web portal, delete all</text>
  </g>
</svg>
