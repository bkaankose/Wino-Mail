# TLS test endpoints. Each variant terminates implicit TLS with its own certificate and forwards
# plaintext to the hub's IMAP (143) and submission (587) ports or to Baikal (80).
# Backends are resolved per connection, so the proxy starts even while they are still down.
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

stream {
    resolver 127.0.0.11 valid=30s ipv6=off;
    ssl_protocols TLSv1.2 TLSv1.3;

    server { listen 1993 ssl; ssl_certificate /certs/valid.fullchain.pem;     ssl_certificate_key /certs/valid.key;     set $imap dovecot:143; proxy_pass $imap; }
    server { listen 2993 ssl; ssl_certificate /certs/wronghost.fullchain.pem; ssl_certificate_key /certs/wronghost.key; set $imap dovecot:143; proxy_pass $imap; }
    server { listen 3993 ssl; ssl_certificate /certs/expired.fullchain.pem;   ssl_certificate_key /certs/expired.key;   set $imap dovecot:143; proxy_pass $imap; }
    server { listen 4993 ssl; ssl_certificate /certs/revoked.fullchain.pem;   ssl_certificate_key /certs/revoked.key;   set $imap dovecot:143; proxy_pass $imap; }

    server { listen 1465 ssl; ssl_certificate /certs/valid.fullchain.pem;     ssl_certificate_key /certs/valid.key;     set $smtp dovecot:587; proxy_pass $smtp; }
    server { listen 2465 ssl; ssl_certificate /certs/wronghost.fullchain.pem; ssl_certificate_key /certs/wronghost.key; set $smtp dovecot:587; proxy_pass $smtp; }
    server { listen 3465 ssl; ssl_certificate /certs/expired.fullchain.pem;   ssl_certificate_key /certs/expired.key;   set $smtp dovecot:587; proxy_pass $smtp; }
    server { listen 4465 ssl; ssl_certificate /certs/revoked.fullchain.pem;   ssl_certificate_key /certs/revoked.key;   set $smtp dovecot:587; proxy_pass $smtp; }
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;
    access_log off;
    client_max_body_size 50m;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_redirect http://$host:$server_port/ https://$host:$server_port/;

    server { listen 8443 ssl; ssl_certificate /certs/valid.fullchain.pem;     ssl_certificate_key /certs/valid.key;     location / { set $dav http://baikal:80; proxy_pass $dav; } }
    server { listen 8444 ssl; ssl_certificate /certs/wronghost.fullchain.pem; ssl_certificate_key /certs/wronghost.key; location / { set $dav http://baikal:80; proxy_pass $dav; } }
    server { listen 8445 ssl; ssl_certificate /certs/expired.fullchain.pem;   ssl_certificate_key /certs/expired.key;   location / { set $dav http://baikal:80; proxy_pass $dav; } }
    server { listen 8446 ssl; ssl_certificate /certs/revoked.fullchain.pem;   ssl_certificate_key /certs/revoked.key;   location / { set $dav http://baikal:80; proxy_pass $dav; } }
}
