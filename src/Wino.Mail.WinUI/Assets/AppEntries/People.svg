<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Wino People</title>
  <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#007DE3"/><stop offset="1" stop-color="#0046AC"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="20" x2="0" y2="180" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5FB"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="50" x2="0" y2="160" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00BCFF"/><stop offset="1" stop-color="#0090F7"/>
  </linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#001B44" flood-opacity="0.34"/>
  </filter>
  <filter id="shs" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#001B44" flood-opacity="0.38"/>
  </filter>
</defs>
  <rect x="0" y="0" width="200" height="200" rx="45.5" fill="url(#bg)"/>

  <g transform="translate(100 96) scale(0.98947) translate(-100 -100)">
    <g filter="url(#sh)">
      <g fill="url(#acc)"><circle cx="56" cy="86" r="15"/><path d="M56 103 c-16.7 0 -27.0 18.6 -27.0 30.0 a5 5 0 0 0 5 5 h44.0 a5 5 0 0 0 5 -5 c0 -11.4 -10.3 -30.0 -27.0 -30.0 Z"/></g>
      <g fill="url(#acc)"><circle cx="144" cy="86" r="15"/><path d="M144 103 c-16.7 0 -27.0 18.6 -27.0 30.0 a5 5 0 0 0 5 5 h44.0 a5 5 0 0 0 5 -5 c0 -11.4 -10.3 -30.0 -27.0 -30.0 Z"/></g>
    </g>
    <!-- gap around the front figure; painted with the tile gradient (Direct2D ignores <mask>) -->
    <g fill="none" stroke="url(#bg)" stroke-width="11" stroke-linejoin="round"><circle cx="100" cy="80" r="24"/><path d="M100 111c-25 0-45 16-48 37a7 7 0 0 0 7 8h82a7 7 0 0 0 7-8c-3-21-23-37-48-37Z"/></g>
    <g fill="url(#paper)" filter="url(#sh)"><circle cx="100" cy="80" r="24"/><path d="M100 111c-25 0-45 16-48 37a7 7 0 0 0 7 8h82a7 7 0 0 0 7-8c-3-21-23-37-48-37Z"/></g>
  </g>

</svg>
