<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <title>Wino</title>
  <defs>
    <!-- Shared app tile background: 45deg gradient, top-left -> bottom-right.
         Declared in the squircle's own 37..219 space (see the group transform below). -->
    <linearGradient id="winoTile" gradientUnits="userSpaceOnUse" x1="37" y1="37" x2="219" y2="219">
      <stop offset="0" stop-color="#007DE3"/>
      <stop offset="1" stop-color="#0046AC"/>
    </linearGradient>

    <!-- ===== Mail (quadrant coordinates: the source glyph's own 37..219 space) ===== -->
    <linearGradient id="mailFaceLeft" gradientUnits="userSpaceOnUse" x1="70" y1="70" x2="122.5" y2="122.5">
      <stop offset="0" stop-color="#20DFFF"/>
      <stop offset="1" stop-color="#03A8FF"/>
    </linearGradient>
    <linearGradient id="mailFaceFront" gradientUnits="userSpaceOnUse" x1="114.5" y1="114.5" x2="185" y2="185">
      <stop offset="0" stop-color="#04C3FF"/>
      <stop offset="0.12" stop-color="#01B7FF"/>
      <stop offset="1" stop-color="#005FE4"/>
    </linearGradient>
    <linearGradient id="mailFaceRight" gradientUnits="userSpaceOnUse" x1="121.75" y1="121.75" x2="177" y2="177">
      <stop offset="0" stop-color="#00C4FF"/>
      <stop offset="0.475" stop-color="#00AAFF"/>
      <stop offset="1" stop-color="#008DF0"/>
    </linearGradient>
    <linearGradient id="mailFlap" gradientUnits="userSpaceOnUse" x1="70" y1="70" x2="150" y2="150">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F5F6"/>
    </linearGradient>
    <clipPath id="mailBodyClip">
      <rect x="65" y="75.2" width="126" height="105.05" rx="15" ry="15"/>
    </clipPath>

    <!-- ===== Calendar (source glyph's 0..200 space) ===== -->
    <linearGradient id="calPaper" x1="0" y1="20" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5FB"/>
    </linearGradient>
    <linearGradient id="calAcc" x1="0" y1="50" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00BCFF"/><stop offset="1" stop-color="#0090F7"/>
    </linearGradient>
    <linearGradient id="calHdr" x1="36" y1="40" x2="164" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C4FF"/><stop offset="1" stop-color="#0072E8"/>
    </linearGradient>
    <linearGradient id="calRing" x1="0" y1="24" x2="0" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2E4E7"/><stop offset="1" stop-color="#CDD0D5"/>
    </linearGradient>
    <clipPath id="calCard"><rect x="36" y="40" width="128" height="124" rx="14"/></clipPath>

    <!-- ===== People (source glyph's 0..200 space) ===== -->
    <linearGradient id="pplPaper" x1="0" y1="20" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F5FB"/>
    </linearGradient>
    <linearGradient id="pplAcc" x1="0" y1="50" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00BCFF"/><stop offset="1" stop-color="#0090F7"/>
    </linearGradient>
    <!-- The People glyph fakes the gap around the front figure by stroking it with the
         tile gradient (Direct2D ignores <mask>). These endpoints are the quadrant-local
         pre-image of the tile gradient, so the stroke matches the surrounding background. -->
    <linearGradient id="pplTileMatch" gradientUnits="userSpaceOnUse"
                    x1="-44.16" y1="-203" x2="413.5" y2="254.66">
      <stop offset="0" stop-color="#007DE3"/><stop offset="1" stop-color="#0046AC"/>
    </linearGradient>

    <!-- ===== To Do (source glyph's 37..219 space) ===== -->
    <linearGradient id="todoCard" gradientUnits="userSpaceOnUse" x1="128" y1="72" x2="128" y2="184">
      <stop offset="0" stop-color="#FEFEFF"/>
      <stop offset="1" stop-color="#F2F6FC"/>
    </linearGradient>
    <linearGradient id="todoCheck" gradientUnits="userSpaceOnUse" x1="128" y1="98" x2="128" y2="158">
      <stop offset="0" stop-color="#00B5FE"/>
      <stop offset="1" stop-color="#009AF9"/>
    </linearGradient>

    <!--
      Shadows are attached to the shapes that cast them (not drawn as separate
      shapes) so they degrade cleanly: Direct2D - which rasterises SVG for WinUI -
      ignores filters, leaving the artwork intact but flat.
    -->
    <filter id="winoShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#001B44" flood-opacity="0.34"/>
    </filter>
    <filter id="winoShadowSmall" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#001B44" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Squircle tile (continuous-curvature corners), authored at 182 and scaled to 200 -->
  <g transform="scale(1.098901) translate(-37 -37)">
    <path fill="url(#winoTile)"
          d="M80.91 37 H175.09
             C185.31 37 197.53 39.11 207.21 48.79
             C216.89 58.47 219 70.69 219 80.91
             V175.09
             C219 185.31 216.89 197.53 207.21 207.21
             C197.53 216.89 185.31 219 175.09 219
             H80.91
             C70.69 219 58.47 216.89 48.79 207.21
             C39.11 197.53 37 185.31 37 175.09
             V80.91
             C37 70.69 39.11 58.47 48.79 48.79
             C58.47 39.11 70.69 37 80.91 37 Z"/>
  </g>

  <!-- ===== Top-left: Mail ===== -->
  <g transform="translate(63 63) scale(0.492) translate(-128 -127.7)">
    <g filter="url(#winoShadow)">
      <g clip-path="url(#mailBodyClip)">
        <rect x="65" y="75.2" width="126" height="105.05" fill="url(#mailFaceFront)"/>
        <!-- left fold face -->
        <path d="M198.4 60 L57.2 170 L57.2 60 Z" fill="url(#mailFaceLeft)"/>
        <!-- right fold face -->
        <path d="M57.6 60 L198.8 170 L198.8 60 Z" fill="url(#mailFaceRight)"/>
        <g filter="url(#winoShadowSmall)">
          <path fill="url(#mailFlap)"
                d="M65 93.3 V90.2
                   A15 15 0 0 1 80 75.2
                   H176
                   A15 15 0 0 1 191 90.2
                   V93.3
                   L135.3 136.8
                   Q128 142.5 120.7 136.8 Z"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== Top-right: Calendar ===== -->
  <g transform="translate(137 63) scale(0.39) translate(-100 -96)">
    <g filter="url(#winoShadowSmall)">
      <rect x="62" y="28" width="7" height="20" rx="3.5" fill="url(#calRing)"/>
      <rect x="96.5" y="28" width="7" height="20" rx="3.5" fill="url(#calRing)"/>
      <rect x="131" y="28" width="7" height="20" rx="3.5" fill="url(#calRing)"/>
    </g>
    <g filter="url(#winoShadow)">
      <rect x="36" y="40" width="128" height="124" rx="14" fill="url(#calPaper)"/>
      <g clip-path="url(#calCard)">
        <rect x="36" y="40" width="128" height="27" fill="url(#calHdr)"/>
        <rect x="61" y="76.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
        <rect x="90" y="76.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
        <rect x="119" y="76.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
        <rect x="61" y="105.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
        <rect x="90" y="105.5" width="20" height="20" rx="6" fill="url(#calAcc)"/>
        <rect x="119" y="105.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
        <rect x="61" y="134.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
        <rect x="90" y="134.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
        <rect x="119" y="134.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
      </g>
    </g>
  </g>

  <!-- ===== Bottom-left: People ===== -->
  <g transform="translate(63 137) scale(0.437) translate(-100 -110.5)">
    <g filter="url(#winoShadow)">
      <g fill="url(#pplAcc)"><circle cx="56" cy="86" r="15"/><path d="M56 103 c-16.7 0 -27.0 18.6 -27.0 30.0 a5 5 0 0 0 5 5 h44.0 a5 5 0 0 0 5 -5 c0 -11.4 -10.3 -30.0 -27.0 -30.0 Z"/></g>
      <g fill="url(#pplAcc)"><circle cx="144" cy="86" r="15"/><path d="M144 103 c-16.7 0 -27.0 18.6 -27.0 30.0 a5 5 0 0 0 5 5 h44.0 a5 5 0 0 0 5 -5 c0 -11.4 -10.3 -30.0 -27.0 -30.0 Z"/></g>
    </g>
    <!-- gap around the front figure; painted with the tile gradient (Direct2D ignores <mask>) -->
    <g fill="none" stroke="url(#pplTileMatch)" stroke-width="11" stroke-linejoin="round">
      <circle cx="100" cy="80" r="24"/>
      <path d="M100 111c-25 0-45 16-48 37a7 7 0 0 0 7 8h82a7 7 0 0 0 7-8c-3-21-23-37-48-37Z"/>
    </g>
    <g fill="url(#pplPaper)" filter="url(#winoShadow)">
      <circle cx="100" cy="80" r="24"/>
      <path d="M100 111c-25 0-45 16-48 37a7 7 0 0 0 7 8h82a7 7 0 0 0 7-8c-3-21-23-37-48-37Z"/>
    </g>
  </g>

  <!-- ===== Bottom-right: To Do ===== -->
  <g transform="translate(137 137) scale(0.42) translate(-128 -128)">
    <g filter="url(#winoShadow)">
      <rect x="72" y="72" width="112" height="112" rx="28" ry="28" fill="url(#todoCard)"/>
    </g>
    <path d="M97.5 128.5 L119 150 L157.1 106.5"
          fill="none"
          stroke="url(#todoCheck)"
          stroke-width="17"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
