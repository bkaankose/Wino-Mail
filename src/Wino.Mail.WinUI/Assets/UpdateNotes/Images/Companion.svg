<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Wino Companion</title>
  <defs>
    <linearGradient id="cp-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF2FB"/>
    </linearGradient>
    <linearGradient id="cp-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00BCFF"/>
      <stop offset="1" stop-color="#0072E8"/>
    </linearGradient>
    <linearGradient id="cp-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5F4AE4"/>
      <stop offset="1" stop-color="#491FD1"/>
    </linearGradient>
    <linearGradient id="cp-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4657"/>
      <stop offset="1" stop-color="#232B38"/>
    </linearGradient>
  </defs>

  <!--  Companion flyout, right-aligned above the tray  -->
  <rect x="34" y="12" width="84" height="80" rx="10" fill="url(#cp-panel)" stroke="#C6D5EE" stroke-width="1.5"/>

  <!--  Favourite contacts  -->
  <circle cx="46" cy="26" r="5" fill="#C6D5EE"/>
  <circle cx="59" cy="26" r="5" fill="#C6D5EE"/>
  <circle cx="72" cy="26" r="5" fill="#C6D5EE"/>
  <rect x="41" y="37" width="70" height="2" rx="1" fill="#C6D5EE"/>

  <!--  Next event, the thing the companion puts in front of you  -->
  <rect x="41" y="45" width="70" height="22" rx="6" fill="#E3EFFD"/>
  <rect x="47" y="51" width="22" height="4.5" rx="2.25" fill="url(#cp-acc)"/>
  <rect x="47" y="59" width="44" height="4" rx="2" fill="#9FBEE4"/>

  <!--  Unread mail line  -->
  <rect x="41" y="73" width="52" height="4.5" rx="2.25" fill="#C6D5EE"/>
  <rect x="41" y="82" width="38" height="4.5" rx="2.25" fill="#C6D5EE"/>

  <!--  Taskbar with the Wino tray icon lit  -->
  <rect x="6" y="100" width="116" height="22" rx="8" fill="url(#cp-bar)"/>
  <rect x="78" y="103" width="16" height="16" rx="5" fill="url(#cp-tile)"/>
  <rect x="82" y="121" width="8" height="2.5" rx="1.25" fill="url(#cp-acc)"/>
  <rect x="98" y="108" width="14" height="6" rx="3" fill="#7A8699"/>
  <rect x="16" y="108" width="10" height="6" rx="3" fill="#7A8699"/>
  <rect x="32" y="108" width="10" height="6" rx="3" fill="#7A8699"/>
</svg>
