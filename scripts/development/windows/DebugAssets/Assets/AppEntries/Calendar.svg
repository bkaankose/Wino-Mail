<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Wino Calendar</title>
  <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#EDBF5C"/><stop offset="1" stop-color="#E8AE32"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="20" x2="0" y2="180" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FCFAF7"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="50" x2="0" y2="160" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#EFC56C"/><stop offset="1" stop-color="#EEC367"/>
  </linearGradient>
  <linearGradient id="hdr" x1="36" y1="40" x2="164" y2="67" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#EFC56C"/><stop offset="1" stop-color="#EDC05F"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="24" x2="0" y2="42" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#EFEEED"/><stop offset="1" stop-color="#E4E2DF"/>
  </linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64480B" flood-opacity="0.34"/>
  </filter>
  <filter id="shs" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#64480B" flood-opacity="0.38"/>
  </filter>
  <clipPath id="card"><rect x="36" y="40" width="128" height="124" rx="14"/></clipPath>
</defs>
  <rect x="0" y="0" width="200" height="200" rx="45.5" fill="url(#bg)"/>
  <g filter="url(#shs)"><rect x="62" y="28" width="7" height="20" rx="3.5" fill="url(#ring)"/><rect x="96.5" y="28" width="7" height="20" rx="3.5" fill="url(#ring)"/><rect x="131" y="28" width="7" height="20" rx="3.5" fill="url(#ring)"/></g>
  <g filter="url(#sh)">
    <rect x="36" y="40" width="128" height="124" rx="14" fill="url(#paper)"/>
    <g clip-path="url(#card)"><rect x="36" y="40" width="128" height="27" fill="url(#hdr)"/>
    <rect x="61" y="76.5" width="20" height="20" rx="6" fill="#FAF2E3"/>
    <rect x="90" y="76.5" width="20" height="20" rx="6" fill="#FAF2E3"/>
    <rect x="119" y="76.5" width="20" height="20" rx="6" fill="#FAF2E3"/>
    <rect x="61" y="105.5" width="20" height="20" rx="6" fill="#FAF2E3"/>
    <rect x="90" y="105.5" width="20" height="20" rx="6" fill="url(#DCD7CB)"/>
    <rect x="119" y="105.5" width="20" height="20" rx="6" fill="#FAF2E3"/>
    <rect x="61" y="134.5" width="20" height="20" rx="6" fill="#FAF2E3"/>
    <rect x="90" y="134.5" width="20" height="20" rx="6" fill="#FAF2E3"/>
    <rect x="119" y="134.5" width="20" height="20" rx="6" fill="#FAF2E3"/>
  </g>
  </g>
