# makepkg configuration of build-arch.sh. A complete file, so the result does not depend on the host's
# /etc/makepkg.conf (Ubuntu's makepkg package or an Arch system); --config also skips the user's makepkg.conf.
# PKGDEST, BUILDDIR, SRCDEST, PACKAGER and SOURCE_DATE_EPOCH come from the environment.
CARCH="x86_64"
CHOST="x86_64-pc-linux-gnu"
BUILDENV=(!distcc !color !ccache !check !sign fakeroot)
OPTIONS=(!strip docs !libtool !staticlibs !emptydirs !zipman purge !debug !lto)
INTEGRITY_CHECK=(sha256)
MAN_DIRS=(usr{,/local}{,/share}/{man,info})
DOC_DIRS=(usr/{,local/}{,share/}{doc,gtk-doc})
PURGE_TARGETS=(usr/{,share}/info/dir .packlist *.pod)
DBGSRCDIR="/usr/src/debug"
LIB_DIRS=('lib:usr/lib' 'lib32:usr/lib32')
COMPRESSZST=(zstd -c -T0 -19 -)
PKGEXT='.pkg.tar.zst'
SRCEXT='.src.tar.gz'
