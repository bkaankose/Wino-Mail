name: Manual Beta Release

on:
  workflow_dispatch:
    inputs:
      release_title:
        description: Optional GitHub prerelease title
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  release-beta:
    runs-on: windows-latest
    env:
      WINO_BETA_RELEASE_SIGNING_ENDPOINT: ${{ secrets.WINO_BETA_RELEASE_SIGNING_ENDPOINT }}
      WINO_BETA_RELEASE_SIGNING_ACCOUNT_NAME: ${{ secrets.WINO_BETA_RELEASE_SIGNING_ACCOUNT_NAME }}
      WINO_BETA_RELEASE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.WINO_BETA_RELEASE_SIGNING_CERTIFICATE_PROFILE_NAME }}
      WINO_BETA_RELEASE_PUBLISHER_SUBJECT: ${{ secrets.WINO_BETA_RELEASE_PUBLISHER_SUBJECT }}
      WINO_BETA_RELEASE_AZURE_TENANT_ID: ${{ secrets.WINO_BETA_RELEASE_AZURE_TENANT_ID }}
      WINO_BETA_RELEASE_AZURE_CLIENT_ID: ${{ secrets.WINO_BETA_RELEASE_AZURE_CLIENT_ID }}
      WINO_BETA_RELEASE_AZURE_CLIENT_SECRET: ${{ secrets.WINO_BETA_RELEASE_AZURE_CLIENT_SECRET }}
      WINO_BETA_RELEASE_APPINSTALLER_URI: ${{ vars.WINO_BETA_RELEASE_APPINSTALLER_URI }}
      WINO_BETA_RELEASE_PACKAGE_BASE_URI: ${{ vars.WINO_BETA_RELEASE_PACKAGE_BASE_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check beta artwork
        shell: pwsh
        run: |
          if (-not (Test-Path 'release-assets/Beta/Assets/Wino_Icon.ico')) {
            throw 'Supply the beta artwork under release-assets/Beta before publishing.'
          }
      - name: Install Artifact Signing client
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.95 -Source https://api.nuget.org/v3/index.json -OutputDirectory "$env:RUNNER_TEMP/signing" -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Artifact Signing client installation failed.' }
          $dlib = Get-ChildItem "$env:RUNNER_TEMP/signing" -Filter Azure.CodeSigning.Dlib.dll -Recurse |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (-not $dlib) { throw 'The x64 Artifact Signing library was not found.' }
          "WINO_BETA_RELEASE_SIGNING_DLIB_PATH=$($dlib.FullName)" >> $env:GITHUB_ENV
      - name: Verify packaging logic
        shell: pwsh
        run: ./tests/scripts/Build-Releases.Tests.ps1
      - name: Build and sign isolated beta
        shell: pwsh
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-releases.ps1 -NonInteractive -Beta -Architectures x86,x64,ARM64
      - name: Preserve verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isolated-beta
          path: src/Wino.Mail.WinUI/AppPackages/WinoMail_Beta_*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          [xml]$manifest = Get-Content src/Wino.Mail.WinUI/Package.appxmanifest
          $version = [string]$manifest.Package.Identity.Version
          $folder = "src/Wino.Mail.WinUI/AppPackages/WinoMail_Beta_$version"
          $archive = Join-Path $env:RUNNER_TEMP "WinoMail_Beta_$version.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $archive
          $title = if ($env:RELEASE_TITLE) { $env:RELEASE_TITLE } else { "Wino Mail Beta $version" }
          gh release create "beta/v$version" $archive --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes-file CHANGELOG.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease publication failed.' }
