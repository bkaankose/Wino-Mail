<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Calendar</title>
  <!--
    The Wino Calendar app icon with its tile removed, drawn for a light surface.

    The Dark variant plus a keyline: the card keeps its paper fill and gains an accent
    contour, drawn inside the card clip so it takes the card's corner radius rather than
    needing a second rounded rect to match. The three rings are too narrow to hold a stroke
    - seven units wide, with nothing left inside it - so they take the accent as a fill
    instead of the near-white metal they carry on a dark surface.

    Every colour comes from the shared switcher palette and is substituted at runtime by
    AppModeGlyphPalette.
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="20" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8EFF9"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="50" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00AAFF"/><stop offset="1" stop-color="#0090F7"/>
    </linearGradient>
    <linearGradient id="hdr" x1="36" y1="40" x2="164" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C4FF"/><stop offset="1" stop-color="#005FE4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="24" x2="0" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00AAFF"/><stop offset="1" stop-color="#005FE4"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#001B44" flood-opacity="0.34"/>
    </filter>
    <filter id="shs" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#001B44" flood-opacity="0.38"/>
    </filter>
    <clipPath id="card"><rect x="36" y="40" width="128" height="124" rx="14"/></clipPath>
  </defs>
  <g filter="url(#shs)"><rect x="62" y="28" width="7" height="20" rx="3.5" fill="url(#ring)"/><rect x="96.5" y="28" width="7" height="20" rx="3.5" fill="url(#ring)"/><rect x="131" y="28" width="7" height="20" rx="3.5" fill="url(#ring)"/></g>
  <g filter="url(#sh)">
    <rect x="36" y="40" width="128" height="124" rx="14" fill="url(#paper)"/>
    <g clip-path="url(#card)"><rect x="36" y="40" width="128" height="27" fill="url(#hdr)"/>
    <rect x="61" y="76.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
    <rect x="90" y="76.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
    <rect x="119" y="76.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
    <rect x="61" y="105.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
    <rect x="90" y="105.5" width="20" height="20" rx="6" fill="url(#acc)"/>
    <rect x="119" y="105.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
    <rect x="61" y="134.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
    <rect x="90" y="134.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
    <rect x="119" y="134.5" width="20" height="20" rx="6" fill="#CFE1FB"/>
    <!-- Keyline: half of a 7 wide stroke inset by 3.5, so its outer edge lands on the card edge. -->
    <rect x="39.5" y="43.5" width="121" height="117" rx="10.5" fill="none" stroke="#005FE4" stroke-width="7"/>
  </g>
  </g>
</svg>
