<svg xmlns="http://www.w3.org/2000/svg" width="182" height="182" viewBox="37 37 182 182" fill="none">
  <title>Mail</title>
  <!-- Light-theme variant: the envelope flap uses a dark neutral on the light control surface. -->
  <defs>
    <linearGradient id="mailFaceLeft" gradientUnits="userSpaceOnUse" x1="70" y1="70" x2="122.5" y2="122.5">
      <stop offset="0" stop-color="#20DFFF"/>
      <stop offset="1" stop-color="#03A8FF"/>
    </linearGradient>
    <linearGradient id="mailFaceFront" gradientUnits="userSpaceOnUse" x1="114.5" y1="114.5" x2="185" y2="185">
      <stop offset="0" stop-color="#04C3FF"/>
      <stop offset="0.12" stop-color="#01B7FF"/>
      <stop offset="1" stop-color="#005FE4"/>
    </linearGradient>
    <linearGradient id="mailFaceRight" gradientUnits="userSpaceOnUse" x1="121.75" y1="121.75" x2="177" y2="177">
      <stop offset="0" stop-color="#00C4FF"/>
      <stop offset="0.475" stop-color="#00AAFF"/>
      <stop offset="1" stop-color="#008DF0"/>
    </linearGradient>
    <linearGradient id="mailFlap" gradientUnits="userSpaceOnUse" x1="70" y1="70" x2="150" y2="150">
      <stop offset="0" stop-color="#2d3436"/>
      <stop offset="1" stop-color="#2d3436"/>
    </linearGradient>
    <clipPath id="mailBodyClip">
      <rect x="65" y="75.2" width="126" height="105.05" rx="15" ry="15"/>
    </clipPath>
    <filter id="mailShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#001B44" flood-opacity="0.34"/>
    </filter>
    <filter id="mailFlapShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#003A70" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#mailShadow)">
    <g clip-path="url(#mailBodyClip)">
      <rect x="65" y="75.2" width="126" height="105.05" fill="url(#mailFaceFront)"/>
      <path d="M198.4 60 L57.2 170 L57.2 60 Z" fill="url(#mailFaceLeft)"/>
      <path d="M57.6 60 L198.8 170 L198.8 60 Z" fill="url(#mailFaceRight)"/>
      <g filter="url(#mailFlapShadow)">
        <path fill="url(#mailFlap)" d="M65 93.3 V90.2 A15 15 0 0 1 80 75.2 H176 A15 15 0 0 1 191 90.2 V93.3 L135.3 136.8 Q128 142.5 120.7 136.8 Z"/>
      </g>
    </g>
  </g>
</svg>
