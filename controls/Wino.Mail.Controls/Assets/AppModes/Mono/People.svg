<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>People</title>
  <!--
    The monochrome People glyph. The colour artwork separates the front figure from the two
    behind it by painting it in paper against their accent; here the two behind are the same
    ink held back, and the front figure is drawn over them at full strength.

    The order matters. A held-back shape painted over a solid one composites back to the solid
    one - one ink over itself is that ink at any alpha - so the light tier has to be underneath.
  -->
  <g transform="translate(100 96) scale(0.98947) translate(-100 -100)">
    <g fill="#101010" fill-opacity="0.45">
      <circle cx="56" cy="86" r="15" />
      <path d="M56 103c-16.7 0-27 18.6-27 30a5 5 0 0 0 5 5h44a5 5 0 0 0 5-5c0-11.4-10.3-30-27-30Z" />
      <circle cx="144" cy="86" r="15" />
      <path d="M144 103c-16.7 0-27 18.6-27 30a5 5 0 0 0 5 5h44a5 5 0 0 0 5-5c0-11.4-10.3-30-27-30Z" />
    </g>
    <g fill="#101010">
      <circle cx="100" cy="80" r="24" />
      <path d="M100 111c-25 0-45 16-48 37a7 7 0 0 0 7 8h82a7 7 0 0 0 7-8c-3-21-23-37-48-37Z" />
    </g>
  </g>
</svg>
