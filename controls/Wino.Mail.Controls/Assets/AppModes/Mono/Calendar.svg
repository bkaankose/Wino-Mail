<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Calendar</title>
  <!--
    The monochrome Calendar glyph. The card is an outline rather than a filled sheet, so its
    interior is a hole and the cell behind it shows through unchanged.

    Today keeps the emphasis it has in the colour artwork, where it is the one accent cell
    among eight soft ones. One ink cannot say that with hue, so it says it with alpha: the
    other eight are the same ink held back.
  -->
  <g fill="#101010">
    <rect x="62" y="28" width="7" height="20" rx="3.5" />
    <rect x="96.5" y="28" width="7" height="20" rx="3.5" />
    <rect x="131" y="28" width="7" height="20" rx="3.5" />
  </g>

  <rect x="40.5" y="44.5" width="119" height="115" rx="10" fill="none" stroke="#101010" stroke-width="9" />
  <rect x="45" y="49" width="110" height="18" fill="#101010" />

  <g fill="#101010" fill-opacity="0.45">
    <rect x="61" y="76.5" width="20" height="20" rx="6" />
    <rect x="90" y="76.5" width="20" height="20" rx="6" />
    <rect x="119" y="76.5" width="20" height="20" rx="6" />
    <rect x="61" y="105.5" width="20" height="20" rx="6" />
    <rect x="119" y="105.5" width="20" height="20" rx="6" />
    <rect x="61" y="134.5" width="20" height="20" rx="6" />
    <rect x="90" y="134.5" width="20" height="20" rx="6" />
    <rect x="119" y="134.5" width="20" height="20" rx="6" />
  </g>

  <rect x="90" y="105.5" width="20" height="20" rx="6" fill="#101010" />
</svg>
